<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/media/cucu-logo.webp" />
    <meta name="theme-color" content="#096037" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Lenis Smooth Scroll -->
    <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.20/dist/lenis.css">
    <style>
      /* Painted before any script runs so the opening never flashes the page.
         Intro.jsx removes it; the animation is a failsafe if scripts never load. */
      #cucu-intro-cover { position: fixed; inset: 0; z-index: 9999; background: #096037; animation: cucu-cover-out 0.4s 9s forwards; }
      @keyframes cucu-cover-out { to { opacity: 0; visibility: hidden; } }
    </style>
    <noscript><style>#cucu-intro-cover { display: none; }</style></noscript>
    <title>Best Digital Marketing Agency in Hyderabad | Drive Growth with us. </title>
  </head>
  <body>
    <div id="cucu-intro-cover" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
